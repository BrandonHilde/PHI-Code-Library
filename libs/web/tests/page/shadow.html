<!DOCTYPE html>
<html><head><title>shadow</title>
<style>
.in { color: rgb(255, 0, 0) }
x-card { font-size: 20px }
x-card.outer { color: rgb(10, 10, 10) }
x-card::part(lbl) { color: rgb(11, 22, 33) }
x-card.outer::part(lbl) { font-size: 41px }
x-card::part(nope) { color: rgb(0, 0, 1) }
div::part(lbl) { color: rgb(0, 0, 2) }
</style>
</head><body>
<x-card id="card"><span id="s1">slotted</span><b slot="b" id="named">named</b>text</x-card>
<x-card id="card2" class="outer"></x-card>
<x-dsd id="dsd"><template shadowrootmode="open"><style>:host { color: rgb(9, 9, 9) } p { font-size: 25px }</style><p id="dp">declared</p><slot></slot></template>light</x-dsd>
<div id="notahost"><template shadowrootmode="open"><i>stays a template</i></template></div>
<script>
var log = function () { console.log(Array.prototype.join.call(arguments, " ")); };
var style = function (el, p) { return getComputedStyle(el).getPropertyValue(p); };
class XCard extends HTMLElement {
  constructor() {
    super();
    var root = this.attachShadow({ mode: "open" });
    root.innerHTML = "<style>:host { display: block; color: rgb(1, 2, 3) } .in { color: rgb(4, 5, 6) } ::slotted(span) { color: rgb(7, 8, 9) } #wrap { font-size: 30px } #lbl, #other { color: rgb(255, 255, 0) }</style>" +
      "<div id='wrap'><div class='in' id='inner'>inside</div><slot id='d'></slot><slot name='b' id='b'>fallback</slot><slot name='c' id='c'><i>c fallback</i></slot><span part='x lbl' id='lbl'>label</span><span part='other' id='other'>other</span></div>";
  }
}
customElements.define("x-card", XCard);
var card = document.getElementById("card"), root = card.shadowRoot;
var inner = root.getElementById("inner");
log("root:", root instanceof ShadowRoot, root instanceof DocumentFragment, root.mode, root.host === card, root.parentNode, Object.prototype.toString.call(root));
log("tree:", inner.getRootNode() === root, inner.getRootNode({ composed: true }) === document, inner.isConnected, root.contains(inner), document.contains(inner));
log("query:", document.querySelector(".in"), root.querySelector(".in") === inner, root.querySelectorAll("slot").length, document.getElementById("inner"));
log("slots:", root.getElementById("d").assignedNodes().map(function (n) { return n.nodeName; }).join(","), root.getElementById("b").assignedElements().map(function (n) { return n.id; }).join(","), root.getElementById("c").assignedNodes().length, root.getElementById("c").assignedNodes({ flatten: true }).map(function (n) { return n.nodeName; }).join(","));
log("assignedSlot:", document.getElementById("s1").assignedSlot.id, document.getElementById("named").assignedSlot.id, card.lastChild.assignedSlot.id);
log("styles:", style(card, "display"), style(card, "color"), style(inner, "color"), style(document.getElementById("s1"), "color"), style(document.getElementById("named"), "color"));
log("outer wins:", style(document.getElementById("card2"), "color"), style(document.getElementById("card2").shadowRoot.getElementById("inner"), "color"));
log("inherited:", style(inner, "font-size"), style(document.getElementById("s1"), "font-size"), style(root.getElementById("wrap"), "font-size"));
log(":defined and :host from outside:", card.matches(":defined"), card.matches(":host"));
var heard = [];
card.addEventListener("ping", function (e) { heard.push("host:" + e.target.id + ":" + e.eventPhase); });
document.body.addEventListener("ping", function (e) { heard.push("body:" + e.target.id); });
inner.addEventListener("ping", function (e) { heard.push("inner:" + e.target.id); });
root.addEventListener("ping", function (e) { heard.push("root:" + e.target.id); });
inner.dispatchEvent(new CustomEvent("ping", { bubbles: true, composed: true }));
log("composed:", heard.join(" "));
heard = [];
inner.dispatchEvent(new CustomEvent("ping", { bubbles: true }));
log("not composed:", heard.join(" "));
heard = [];
document.getElementById("s1").addEventListener("ping", function (e) { heard.push("s1"); });
root.getElementById("d").addEventListener("ping", function (e) { heard.push("slot:" + e.target.id); });
document.getElementById("s1").dispatchEvent(new CustomEvent("ping", { bubbles: true }));
log("through a slot:", heard.join(" "));
var closed = document.createElement("div").attachShadow({ mode: "closed" });
log("closed:", closed.host.shadowRoot, closed.mode);
try { card.attachShadow({ mode: "open" }); } catch (e) { log("twice:", e.name); }
try { document.createElement("img").attachShadow({ mode: "open" }); } catch (e) { log("img:", e.name); }
log("innerHTML:", root.innerHTML.length > 100, card.innerHTML);
var dsd = document.getElementById("dsd");
log("declarative:", dsd.shadowRoot !== null, dsd.childNodes.length, dsd.firstChild.nodeName, dsd.shadowRoot.getElementById("dp").textContent, style(dsd, "color"), style(dsd.shadowRoot.getElementById("dp"), "font-size"), document.querySelectorAll("template").length);
var div = document.getElementById("notahost");
log("a div can be a host:", div.shadowRoot !== null, div.childNodes.length, HTMLTemplateElement.prototype.hasOwnProperty("shadowRootMode"));
var again = dsd.attachShadow({ mode: "open" });
log("attachShadow on it:", again === dsd.shadowRoot, again.childNodes.length);
var parsed = new DOMParser().parseFromString("<title>t</title><p class=x>parsed</p><div><template shadowrootmode=open><b>in</b></template></div>", "text/html");
var shared = new CSSStyleSheet();
shared.replaceSync(":host { color: rgb(20, 30, 40) } p { font-size: 33px } /* a comment { } */ .q { content: \"}\" }");
customElements.define("x-adopt", class extends HTMLElement { constructor() { super(); var r = this.attachShadow({ mode: "open" }); r.adoptedStyleSheets = [shared]; r.innerHTML = "<p id='ap' class='docadopt'>adopted</p>"; } });
var xa = document.createElement("x-adopt"), xb = document.createElement("x-adopt");
document.body.appendChild(xa);
document.body.appendChild(xb);
var docSheet = new CSSStyleSheet();
docSheet.replaceSync(".docadopt { color: rgb(50, 60, 70) }");
document.adoptedStyleSheets = [docSheet];
var plain = document.createElement("p");
plain.className = "docadopt";
document.body.appendChild(plain);
log("adopted:", style(xa, "color"), style(xb.shadowRoot.getElementById("ap"), "font-size"), style(xa.shadowRoot.getElementById("ap"), "color"), style(plain, "color"), shared.cssRules.length, shared.cssRules[2].selectorText, xa.shadowRoot.adoptedStyleSheets[0] === shared, "adoptedStyleSheets" in Document.prototype, "replace" in CSSStyleSheet.prototype);
shared.insertRule("p { font-size: 11px }", 3);
log("insertRule:", style(xa.shadowRoot.getElementById("ap"), "font-size"), shared.cssRules.length);
xb.shadowRoot.adoptedStyleSheets = [];
log("unadopted:", style(xb, "color"), style(xa, "color"));
log("DOMParser:", parsed.title, parsed.body.innerHTML.length > 0, parsed.querySelector(".x").textContent, parsed.querySelector("div").shadowRoot !== null, parsed === document);
var lbl = root.getElementById("lbl");
log("::part:", style(lbl, "color"), style(lbl, "font-size"), style(root.getElementById("other"), "color"), style(document.getElementById("card2").shadowRoot.getElementById("lbl"), "font-size"), document.querySelector("x-card::part(lbl)"));
</script></body></html>
